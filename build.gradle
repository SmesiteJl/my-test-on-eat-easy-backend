plugins {
    id 'com.technokratos.jacoco-convention'
    id 'com.diffplug.spotless' version '6.25.0' apply false
}

subprojects {
    group = 'com.technokratos.eateasy'
    version = '1.0-SNAPSHOT'

    repositories {
        mavenLocal()
        mavenCentral()
    }

    configurations {
        configureEach {
            resolutionStrategy {
                failOnVersionConflict()
            }
        }
    }
}
