server:
  port: 0


spring:
  application:
    name: authentication-service

  cloud:
    consul:
      host: consul
      port: 8500
      discovery:
        service-name: authentication-service
        instance-id: ${spring.application.name}-${random.value}
        register: true
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 10s
        scheme: http
        deregister: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:eat-easy}
      timeout: 3s

jwt:
  mode: server
  login-url: /api/v1/auth/login
  refresh-url: /api/v1/auth/refresh
  logout-url: /api/v1/auth/logout
  issuer: authentication-service
  tokens:
    access:
      header: Authorization
      prefix: "Bearer "
      expiration: 7m
      key:
        algorithm: RSA
        private-key: ${JWT_ACCESS_PRIVATE_KEY}
        public-key: ${JWT_ACCESS_PUBLIC_KEY}
    refresh:
      use-cookie: true
      cookie-name: refresh_token
      expiration: 48h
      key:
        algorithm: RSA
        private-key: ${JWT_REFRESH_PRIVATE_KEY}
        public-key: ${JWT_REFRESH_PUBLIC_KEY}

custom:
  repository:
    refresh-token:
      key-prefix: "refresh:"
